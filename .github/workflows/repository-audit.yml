name: Repository audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check inventory syntax citation and frozen-output hashes
        run: python scripts/audit_repository.py
